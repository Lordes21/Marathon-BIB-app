<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify &middot; Run Lens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <div class="page__inner">

      <img src="{{ url_for('static', filename='logo.png') }}" alt="Run Lens" class="logo" />

      <div class="step-label">Verification</div>

      <p class="email-display">{{ email }}</p>

      {% if info %}
        <div class="msg msg--info">{{ info }}</div>
      {% endif %}

      {% if error %}
        <div class="msg msg--error">{{ error }}</div>
      {% endif %}

      <form class="form-card" method="POST" action="/verify_and_send">
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="event_id" value="{{ event_id }}">

        <input
          name="code"
          class="input input--center"
          type="text"
          inputmode="numeric"
          pattern="\d{6}"
          minlength="6"
          maxlength="6"
          required
          placeholder="000000"
          autofocus
        />

        <button class="btn" type="submit">Verify &amp; send photos</button>
      </form>

      <form method="POST" action="/request_code" style="width:100%;">
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="event_id" value="{{ event_id }}">
        <button class="btn btn--ghost" type="submit">Resend code</button>
      </form>

      {% if not smtp_ok %}
        <div class="msg msg--error">Email delivery is not configured on this server.</div>
      {% endif %}

      <a href="/" class="back-link">&larr; Start over</a>

    </div>
  </div>
</body>
</html>

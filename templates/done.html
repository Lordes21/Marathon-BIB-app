<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Done &middot; Run Lens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <div class="page__inner">

      <img src="{{ url_for('static', filename='logo.png') }}" alt="Run Lens" class="logo" />

      <div class="divider"></div>

      <div class="msg msg--neutral">{{ message }}</div>

      {% if not smtp_ok %}
        <div class="msg msg--error">Email delivery is not configured on this server.</div>
      {% endif %}

      <a href="/" class="btn btn--ghost">Back to home</a>

    </div>
  </div>
</body>
</html>

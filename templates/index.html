<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Run Lens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <div class="page__inner">

      <img src="{{ url_for('static', filename='logo.png') }}" alt="Run Lens" class="logo" />

      <p class="slogan">Every stride captured. Your race, your photos.</p>

      <form class="form-card" method="POST" action="/request_code" autocomplete="off">

        <div class="select-wrap">
          <select id="event" name="event_id" class="select" required>
            <option value="" disabled selected>Choose your race</option>
            {% for event in events %}
              <option value="{{ event.id }}" {% if selected_event == event.id %}selected{% endif %}>
                {{ event.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <input
          id="email"
          name="email"
          class="input"
          type="email"
          required
          placeholder="Your email address"
          value="{{ email_value|default('', true) }}"
        />

        <button class="btn" type="submit">Get my photos</button>

        <p class="hint">We'll send a verification code to confirm your identity.</p>

        {% if error %}
          <div class="msg msg--error">{{ error }}</div>
        {% endif %}

        {% if not smtp_ok %}
          <div class="msg msg--error">Email delivery is not configured on this server.</div>
        {% endif %}

      </form>

    </div>
  </div>
</body>
</html>
